[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-tools"
version = "0.1.0"
description = "Precision-aware p-adic arithmetic, special functions and exact algebraic bridges"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "David Jaroš"}]
dependencies = []
keywords = ["p-adic", "number theory", "symbolic algebra", "quaternions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
complex = ["mpmath>=1.3"]
docs = ["sphinx>=7", "sphinxcontrib-katex>=0.9", "beautifulsoup4>=4.12"]
test = ["pytest>=8", "sympy>=1.12", "mpmath>=1.3"]
dev = ["pytest>=8", "sympy>=1.12", "mpmath>=1.3", "sphinx>=7", "sphinxcontrib-katex>=0.9", "beautifulsoup4>=4.12", "build>=1"]

[project.urls]
Repository = "https://github.com/DavJ/padiclab"
Documentation = "https://github.com/DavJ/padiclab/tree/master/docs"
Issues = "https://github.com/DavJ/padiclab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
