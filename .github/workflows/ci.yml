name: Tests, packages and HTML manual
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest
  pari-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pari-gp
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_pari_optional.py
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[docs,symbolic,complex]'
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
      - run: python scripts/build_manual.py
      - uses: actions/upload-artifact@v4
        with:
          name: html-documentation
          path: docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: portable-html-manual
          path: docs/_build/padic-tools-manual.html
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/padic-wheel-check
      - run: /tmp/padic-wheel-check/bin/python -m pip install --no-deps dist/*.whl
      - run: |
          /tmp/padic-wheel-check/bin/python - <<'PY'
          from padic_tools import Qp, Q2i, UnramifiedQuadraticField, zeta_p
          from padic_tools import Biquaternions, CliffordAlgebra, Gaussian, GaussianLocalPlace, QuaternionBridge
          from padic_tools import Matrix, Polynomial, exact, exp, log, power, taylor, AnalyticSeries
          from padic_tools import volkenborn_integral
          from padic_tools import solve_linear_ode
          from padic_tools import solve_linear_system, cos, sin
          assert zeta_p(-3,Qp(5)).is_congruent("-31/30")
          L = UnramifiedQuadraticField(Qp(3),[1,0,1])
          x = L(1,2)
          assert x.norm().contains(5) and (x*x.inverse()).is_congruent(1)
          assert x.residue().frobenius() == x.residue()**3
          R = Q2i(12)
          pi = R.uniformizer()
          assert ((pi-1)**2).is_congruent(-1)
          assert pi.valuation() == 1 and R(2).valuation() == 2
          assert pi.norm().contains(2) and (pi*pi.inverse()).is_congruent(1)
          assert tuple(c.precision for c in R(1,1,absprec=5).coefficients) == (3,2)
          for p in (2, 3, 5):
              place = GaussianLocalPlace(Qp(p, 3), root_sign=-1)
              assert (place.generator_image(absprec=17)**2).is_congruent(-1)
              q = Biquaternions(Gaussian(1,2), Gaussian(3,-1), 0, 1)
              local = QuaternionBridge(q).local(place, absprec=17)
              C = CliffordAlgebra((1,1,1), place.field)
              mapped = q.to_clifford().map_coefficients(C, lambda c: place(c, absprec=17))
              assert mapped.is_congruent(local.to_clifford(), 17)
              assert local.norm().is_congruent(place(q.norm(), absprec=17))
          M = Matrix(exact, [[1,2],[3,7]])
          assert M.solve([1,0]) == (7,-3)
          for base in (Qp(3,3), Q2i(3)):
              A = Matrix(base, [[1,2],[3,7]], absprec=19)
              assert A.inverse().contains(M.inverse())
              assert min(c.precision for row in A.inverse() for c in row) >= 19
              assert all(x.contains(y) for x,y in zip(A.solve([1,0]), (7,-3)))
          D = Matrix(Qp(3,12), [[9,0],[0,243]], absprec=21)
          report = D.solve_with_info([1,1])
          assert report.pivot_valuations == (2,5) and report.condition_exponent == 3
          assert report.precisions == (14,11)
          for L in (UnramifiedQuadraticField(Qp(3,3), [1,0,1]), Q2i(3)):
              x = L(L.p**2, L.p**2, absprec=21)
              assert log(exp(x)).is_congruent(x, 21)
              assert (power(1+x, exact(1)/(L.p+1))**(L.p+1)).is_congruent(1+x, 21)
              point = x+L(0, L.p**4, absprec=23)
              assert taylor(exp, x, order=24)(point).is_congruent(exp(point), 21)
          pi = R(0,1,absprec=19)
          assert log(pi, p_branch=1).contains(exact(1)/2)
          for K in (Qp(3,3), Q2i(3)):
              series = AnalyticSeries.from_function(exp, K, order=48, precision=21)
              x = K(K.p**2, absprec=25)
              assert series.derivative(2)(x, precision=21).is_congruent(exp(x), 21)
              assert series.antiderivative()(x, precision=21).is_congruent(exp(x)-1, 21)
              family = AnalyticSeries(K, [1], radius=1, tail_bound=(0,0), precision=18)
              assert family(K.p).precision == getattr(K, 'ramification_index', 1)
              local_log = AnalyticSeries.from_function(log, K, center=K.p, order=20, precision=9)
              assert local_log.derivative()(K.p, precision=60).contains(exact(1)/K.p)
              z = K(K.p**2, absprec=40)
              assert volkenborn_integral(series, scale=K.p**2, precision=21).is_congruent(z/(exp(z)-1), 21)
              a = AnalyticSeries.from_polynomial(K, [-1])
              y = solve_linear_ode(a, 3, forcing=2, order=64)
              assert y(K.p**2, precision=21).is_congruent(2+exp(-z), 21)
              assert y(0, precision=60).contains(3)
              phi = solve_linear_system([[0,1],[-1,0]], Matrix.identity(exact,2), field=K, order=48)
              assert phi(K.p**2, precision=21).is_congruent(Matrix(K,[[cos(z),sin(z)],[-sin(z),cos(z)]]),21)
              h = AnalyticSeries(K,[0,1],tail_bound=None)
              airy = solve_linear_system([[0,1],[h,0]], Matrix.identity(exact,2), order=24)
              assert K(airy[0,0][3]).contains(exact(1)/6)
          assert volkenborn_integral(Polynomial([0, 1])) == -exact(1)/2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/*
